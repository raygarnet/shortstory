  <script>
    const chapterContents = {
      1: [
        "目覚めるとそこは俺の部屋だった。そこは当たり前なんだが、なんかいつもと違う。なんだか違和感がある、その違和感の正体はすぐに分かった。俺は浮いていた、俺の部屋で寝ている俺を俯瞰で見ていた。なんとも奇怪な光景だ。「俺ってこんな顔してるのか」もちろん鏡では見たことはあるものの自分の生活を客観的に見ることはないしかもリアルタイムで。そういった方向で見る自分の姿はなんだか新鮮でまるで知らない人間のように見えた。",
        "だが、自分だということは一目見て分かる。不思議な感覚だ「これって幽体離脱ってやつか？」疑問を思わず口に出してしまった。不思議と恐怖や焦りはなく随分と落ち着いていた、どちらかというとわくわくしていたのかもしれない。幽体離脱出来たらなにをしようか？子供のころに夢見る難題である。俺はとりあず家を出て街を散策しに行くことにした。",
        "まず確認することがある。それは、自分は他人に見えているのかどうか。これが分かるだけで大分話は変わってくる。見えていなければ生身ではできないような馬鹿馬鹿しい事や、倫理観に反するような事。具体的に言うとエロいことだ、のぞきとか。俺のちっこいおつむではそんな活用？方法が関の山だった。とりあえずそこらへんにいる人に声をかけようと試みる。",
        "だが時間は夜の１２時ということもあり、辺りは閑散としている。人気もなく誰かが歩いている様子もない。この辺りは居酒屋や商業施設に乏しく夜になると一気に人がいなくなる住宅街だ。「幽体離脱するんだったらもっと賑やか所住めばよかった・・・」訳の分からない愚痴をこぼし近くにある公園へと歩いて、ではなく”浮いて”行った。公園に着いた。「やっぱ誰もいねえなあそりゃそうか」落胆の声が寂しい深夜の公園に響き渡る。",
    　　 "帰ろうかとふとベンチに視線を向けるとスーツのままベンチに座り涙を流す２０代くらいのＯＬの姿があった。何事だ！？と内心人に会えた喜びで不謹慎にもテンションが上がる。とりあえず自分の姿が見えるかどうかのチェックをしようと近寄る。十中八九見えてないだろうとは思いつつも、もしかしたらもあるので念のため。「あのー大丈夫ですか？もしよかったら相談乗りますよ？」本来の自分だったらまず言わないであろう言葉が、滑らかに口から飛び出た。幽体離脱状態はある程度気を大きくさせるのかもしれない。",
    　　"「あのー聞こえてますか？てゆうか見えてます？」彼女はうつむいたまま泣きじゃくる。どうやら見えてもないし聞こえてもないようだ。これでやりたいことができる、枷が外れた！と心躍ったものの泣きじゃくる彼女を見るとそんな気も失せてしまった。「何かつらい事でもあったんですか？よかったら俺が相談に乗るけど…このままだと消化不良っていうか…今から倫理観ぶっとんだ遊びするわけだから気持ちよく始めたいし。」もちろん独り言で終わった。今日初めて会った？人だがなんだかほっとけない。一方的ではあるが、関わってしまった代償なのかもしれない。",
    　　"意味はないかもしれないが、隣に座り少し一緒にいることにした。その子にとっては気持ち悪いだけかもしれないが、ほっとけなかった。１０分くらい経っただろうか、泣きじゃくる声が止んだ。彼女はカバンからくしゃくしゃになった手紙を取り出した。このご時世に手紙という手段でやり取りするあたりに純朴な二人の関係性が伺えた。きれいな文字で書かれていたその手紙を締めくくる最後の言葉は、さよならだった。",
        "彼女はその文字を見てまた泣きじゃくる。そのさよならにどんな意味が込められいるのか、それは分からないが、おおよその見当はつく。多分フラれたのだろう。関係ないはずの俺が腹が立ってきた。「その男、ポルターガイストでもして嫌がらせしてやる！」そう口に出し決心した。俺はそいつに嫌がらせすると！",
        "とはいったもののそいつの場所が分からない・・・勢いで何を決心してるんだ俺はと思ったが、手紙には差出人の住所も基本的に書く習わしだ。ならば、と思いその手紙を見てみようとするが、彼女が肝心な差出人の住所が書かれている部分を握りしめていて見えない。どうも困った。しかも泣いているせいか力んでしまっていて離すそぶりもない。幽体ならではのあり得ない角度から覗きこむが、やはりだめだった。",
        "そこから数分経ち半ば諦めていたが、ふと幽体である俺の手が彼女の鼻に触れた。「へっくち」かわいいくしゃみの音とともに手紙が放り投げられた。風の勢いに乗り手紙は飛んでいく。「よし今だ！」幽体の体は結構早く思い通りのスピードを出せるみたいで、飛んで行った手紙にすぐ追いついた。「住所はっと。って遠いな！！」書かれていた住所は北海道。それも釧路だった。",
        "俺はそのままその住所へと飛び立とう、と思ったが住所だけ見てもさすがにピンポイントでその場所にたどり着けるわけがない。幽体なのでもちろんマップアプリの類は使うことはできないし、いくらスピードが出るからとはいえどれだけ時間がかかるのやら。色んな課題が山積みだし、勢いで何をしようとしてるんだ俺は、とふと我に返る。俺が出した答えは・・・",
        "「とりあえず家帰って自分の体に戻ろう！」だった。というか戻れるのか？いままで、幽体離脱できた興奮状態で先送りにしてた戻れるのか？というシンプルな問題。今になって焦りと恐怖がこみ上げる、あたふたしていると彼女はすでにいなくなっていた。多分家に帰ったのだろう。俺も自分の家に取り合えず帰ることにした。家に帰ると俺が眠っている、酷いいびきをかいて。意を決して自分の体に飛び込んだ。",
        "「体が重い。」今まで浮いていたせいかどうも体が重い。だが幸いにも戻れたようだ。時間を見ると４時を過ぎていた。「あれそんな長い事いたっけ俺？」少し疑問に思いながらも体は起きたてのせいかまだ眠い。書かれていた住所をメモ書きして寝ることにした。",
        "起きるといつも通り出社し業務をこなす。いつも通りのルーティーンワークだ。帰りに同僚に飲みに誘われ会社近くの居酒屋へ行く。「幸則は何飲む？」「あー俺は生で。」いつも通りの注文をスムーズに受け答えをする俺こと幸則。仕事の愚痴やプライベートの愚痴、そんな愚痴三昧が終わると少し哲学的な話になったりする。そんな時間になった頃同僚の本田が言った「お前らさ、めっちゃ可愛い彼女連れてる男とめっちゃイケメンな外人連れてる女どっちに腹立つ？」いや哲学的じゃなかった。「どう考えても男の方だろ！うらやましいぜチクショーってなるし」「いやいや女の方も澄ました顔で男どもを下から見てる感満載だぜ？お前らとは違う世界いますけど私みたいな！」どっちでもいいし、何故こんなに盛り上がれるのだろうかコイツら・・・白熱している二人を横目にいていると話を振ってきた本田が言った。「幸則はどっちだよ？」",
         "どっちでもいいと内心思いつつも・・・「まぁ男の方じゃない？そんな可愛い子いるなら別れんなよって思う」「別れる？そんな条件言ってないだろ。ただ連れてるだけだっての。」しまった。完全に昨日の子がオーバーラップしてしまった。「ああすまんすまん！なんでもない」その後妄想がすげえなコイツとかでいじられたが話題は違う方向へ。",
         "「じゃあ俺から質問、その可愛い女の子とお前ら知り合いでその男にフラれたのを知ったならお前らならどうする？」俺の妄想から頂かれた質問みたいだが、今の俺の状況を的確にとらえた質問なだけに少し答えずらい・・・まぁあの子とは知り合いではないが・・・。「そりゃあ話きいて俺の彼女にするだろ！」「それしかねえな」などゲスな方向に舵を切り始めたところで本田が言った「俺なら話聞いてその男が嫌な奴だったらぶん殴りに行くかな」「なにカッコつけてんだよお前！さっきゲスな質問してた癖に」「うるせえよ、それとこれとは別だろ」「ちょっと俺先帰るわ！」皆の会話を遮るように言いおもむろに居酒屋を後にした。",
         "本田の言葉で俺の決心に火が付いた。嫌がらせをしようと思ったがそれもなんか違う。彼女が泣いている理由を確かめ、あわよくば円満な解決に導ければと俺の中に眠る正義感とやらが働いた。全く知りもしない相手に何故こうも感情移入ができるのか。そのことはあんま考えないようにした。",
         "俺は風呂に入り白湯を飲んだ。これで安眠する態勢は整った。さぁ眠るぞ！　・・・・。当たり前だが意気込むほど眠れない。逆に何も考えないようにした。だが何も考えないという事を結局考えてしまっているため逆効果。ふと思った。彼女は何故あんなに泣いていたんだろう。俺の人生であんなに泣いたことあるかな？何回かフラれたことあるけどそんなにだったしなぁ・・・。男と女で違うもんかそういうのって・・・・。あっでも一回だけすげえ泣いたことあったなぁ・・あの時は・・・",
         "気が付いたら起きていた。幽体離脱していたのだ。半信半疑だったがまた幽体になれるとは、と心躍った。幽体離脱する前に事前に衛星写真や周りの建物、大まかな位置などを頭に入れ万全の準備を整えた。「よし出発だ！」俺は部屋を出た。",
         "「うおーすげえ速さだもう俺の家があんなに遠く」どうやら幽体には速度の制限がないみたいだ。飛び方や加速の仕方を感覚で習得しどんどん加速していった。そうすると１時間もしない内に釧路についていた。上空から俯瞰で見れるため衛星写真との誤差が出づらく結構すんなり目的の場所に着いた。そこは・・・",
         "分かってはいたが病院だった。長期の入院となると、差出人の住所を病院の住所にすることがあるらしい。最初に見たときは北海道という地名で、遠い！というインパクトで印象になかったが、恐らく俺が思ってた手紙の内容ではないみたいだ。俺はその病院の中へ入り宛先の名前である金木修一の病室へと向かう。",
         "病院内をすり抜け探してみるが金木修一という病室は見つからない。「病院間違えたかな」そう思い病院名を確認しに看板を見るがやっぱりここで合っている。まだ探してない所があったかな？そう思いもう一度病院内をさまよう。　「やあ！」",
        "「うわぁ！！」突然の声にびっくりした。誰だいきなり声をかけてきやがって・・・ってあれ？声をかける？幽体の俺に？じんわりとした恐怖に、あるはずのない鼓動が早まる。恐る恐る目をやるとそこには好青年がいた。",
        "「あんた誰だ！」そうぶっきらぼうに問いただすと彼は答えた。「あれ？僕を訪ねてきたんじゃないの？さっきから俺がいた病室何回もうろうろしてたし。」「え？もしかしてあんたが。」「もしかしなくても金木修一だよ。この前死んじゃったんだ。」彼は死んでいたのだ。",
        "「死んでる？え・・・」あの子が泣いている理由、さよならの意味はそういう事だったみたいだ。俺もばあちゃんが亡くなった時はひどく泣いた。潜在的には彼女が泣いている理由を知っていたのかもしれない。彼女の痛ましさを考えると自然と目線が下がる。「どうしたのそんな落ち込んで？」金木は陽気に言った。",
        "「いや。」言葉がつっかえる。彼女の事を何も知らない男が幽体になって、手紙の事を知りここまで来たなんて。というかまさか幽霊として現れるなんて完全に想定外だ。あまりの事にたじろぐ。さすがに何の理由もなく、ここまで来たのは無理がある・・彼を探しにここまで来たのがばれてるわけだし。そこで俺が出した結論は。",
        "「あんたの彼女が泣いててその理由を確かめに来たんだ。」本当のことを言うことにした。「え？和美が泣いてた？そうかぁ・・・そうだよな・・・」彼は悲しそうにそうつぶやいた。彼は一拍置いて言った。",
        "「ていうかあなたは誰です？」・・・。当然の疑問だ。「あの。その和美さんが泣いているのをたまたまみた・・・」その後がなんて言えばいいのか分からず、またつっかえる。そうすると彼は言った「あーそういう幽霊か！なるほどね。どうやって死んだんです？って不謹慎か！ハハハ！」「ハハハ・・・。」と空返事をする。なんか納得してくれたみたいで、俺を生霊だとは思ってないみたいだ。「せっかくここまで来たんだからちょっと僕の願いを聞いてくれないですか？」",
        "「願い？」「うん実は僕は生前病弱な体でね、しょっちゅう入院してたんだ。高校の時、和美と出会って付き合ったんだけど、僕はこの体のせいで会社に勤めるも、結局体を崩しちゃってね。和美と一緒に東京で暮らしてたんだけど、僕だけ地元の病院で養生することになって遠距離になっちゃってさ。そんあこともあってか、病状が悪化して多分もう長くないのを悟っちゃって、手紙を出したんですよ。」金木は安らかな顔で淡々と話していた。その顔は、優しくも悲しい表情だった。「って聞いてます？」「ああすまん！なんだっけ？」「ですから、和美に叶えてあげたかった夢ですよ！」金木はその後こう続けた",
        "「僕は漠然と、でも本質的に宇宙が好きで、本気で宇宙飛行士目指してたんですけど病弱だったこともあり諦めざる負えなくなっちゃって。宇宙飛行士の夢を諦める前、高校の時に和美と約束しちゃったんですよ。月から見た地球はどんな景色なのかを教えてって。もうそれも無理な話ですけど。でもこの約束だけは果たしたいんです！どうかお願いします！僕の代わりに宇宙に行って、和美に伝えてあげてくれませんか？画像では分からない本当の景色の感想を！」・・・少しの沈黙が訪れた。その後金木は自分がこの病院に縛られ、出ることができないことを告げた。だから代わりに行ってほしいのだと。",
        "「分かったよ。」「本当ですかありがとうございます！」金木は目を輝かせながら言った。俺はこの幽体で月へ行くことにした。「じゃあ行ってくる。金木さんあんたの彼女のために土産話を持って帰ってくるよ」「和美は何歳になってるかな？」「ん？なんかいったか？」「いや何でもありません！お願いします！」「ん？ああ・・」俺は月へと旅立った。",
　　　　 "月へ行くのにどれくらいかかるだろうか？なんか見切り発車で行っちゃったけど大丈夫か？そんな不安が頭をよぎるが、その不安は一瞬で解消された。月に着いたのである。「え？もう着いた？どんだけ加速したんだ俺。マジか・・・すげえ！！１秒くらいで月に着いちまった！！まさか宇宙旅行ができるとはなぁ幽体の新たな可能性だなこれは・・・。」大声で叫んでしまうくらいの胸の高鳴りを感じた。そして来た道を振り返る。すると言葉では表せないこの世のものとは思えない絶景が見えた。この非常識な光景は宇宙飛行士でも見ることはできない、恐らくいや確実に世界初の眺めだろう。その光景に目を奪われていた。「おっと。あまり遅くなっても悪いしな！報告に戻るか。」",
        "同じ要領で１秒足らずで病院に着く。「おい戻ったぞ！」「やっと帰ってきたんですね。」「やっとってなんだよ結構早かっただろ？」「ああ・・・。そうですね。」歯切れの悪い返事を返す金木。「じゃあ俺そろそろ帰るわあんたの彼女に伝えなきゃいけないしな。」「はい。どうかお願いします。」俺はそのまま家に帰った。そこで驚くものを目にする・・",
        "「なんだコレ・・・」自分の家がなかった。というか街並みも知らないものになっていた。押し寄せる恐怖の濁流。場所はあっている。転々とだが見知った風景が残っている、だがなんか違う。この奇妙な違和感に体の芯が凍り付く。「お、俺の体はどこだ！」その後飛び回って色々探し回った結果俺の体を見つけた。そこは",
        "病院だった。俺の名前の病室がありそこに俺が寝ていた。その体はやせ細り７０歳くらいの老人のようだった。いや明らかに老人だった。髪が全て白髪になっていて、彫刻刀で刻みこれたかのようなしわがあった。その体は生命を維持するために色々な管がつながっており、やっとの事命を維持しているのが分かる。「嘘だ・・・嘘だ嘘だ！！俺じゃないっ！俺の訳が・・ない・・・」だが抗いようもなく、年老いた自分の体を自分だと認識してしまっている。そこで少し気になることがあったのを思い出す。",

    const chapterId = 1;
    let currentPage = 0;

    function updateChapterContent() {
      const content = chapterContents[chapterId][currentPage];
      document.getElementById('chapter-content').textContent = content;
    }

    document.getElementById('next-page').addEventListener('click', () => {
      if (currentPage < chapterContents[chapterId].length - 1) {
        currentPage++;
        updateChapterContent();
      }
    });

    document.getElementById('prev-page').addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        updateChapterContent();
      }
    });

    document.getElementById('back-to-top').addEventListener('click', () => {
      window.location.href = 'index.html'; // トップページのURLに変更
    });

    // 初期表示
