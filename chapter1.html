<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>チャプターページ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Yu Gothic', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: radial-gradient(ellipse at center, #1a1a1a 0%, #000000 100%);
    }
    .container {
      text-align: center;
      padding: 2rem;
      background-color: rgba(20, 20, 20, 0.85);
      border: 1px solid #333;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
      width: 80%;
      max-width: 800px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5em;
      color: #ff4444;
      text-shadow: 1px 1px 5px #000;
    }
    #chapter-content {
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 2rem;
    }
    #navigation {
      margin-top: 2rem;
    }
    button {
      background-color: #333;
      color: #f0f0f0;
      border: 1px solid #444;
      padding: 10px 20px;
      font-size: 1.2rem;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>チャプター01：光速の抜け殻</h1>
    <div id="chapter-content">ここに物語の内容が表示されます。</div>
    <div id="navigation">
      <button id="prev-page">前のページ</button>
      <button id="next-page">次のページ</button>
      <button id="back-to-top">トップページへ戻る</button>
    </div>
  </div>

  <script>
    const chapterContents = {
      1: [
        "目覚めるとそこは俺の部屋だった。そこは当たり前なんだが、なんかいつもと違う。なんだか違和感がある、その違和感の正体はすぐに分かった。俺は浮いていた、俺の部屋で寝ている俺を俯瞰で見ていた。なんとも奇怪な光景だ。「俺ってこんな顔してるのか」もちろん鏡では見たことはあるものの自分の生活を客観的に見ることはないしかもリアルタイムで。そういった方向で見る自分の姿はなんだか新鮮でまるで知らない人間のように見えた。",
        "だが、自分だということは一目見て分かる。不思議な感覚だ「これって幽体離脱ってやつか？」疑問を思わず口に出してしまった。不思議と恐怖や焦りはなく随分と落ち着いていた、どちらかというとわくわくしていたのかもしれない。幽体離脱出来たらなにをしようか？子供のころに夢見る難題である。俺はとりあず家を出て街を散策しに行くことにした。",
        "まず確認することがある。それは、自分は他人に見えているのかどうか。これが分かるだけで大分話は変わってくる。見えていなければ生身ではできないような馬鹿馬鹿しい事や、倫理観に反するような事。具体的に言うとエロいことだ、のぞきとか。俺のちっこいおつむではそんな活用？方法が関の山だった。とりあえずそこらへんにいる人に声をかけようと試みる。"
        "だが時間は夜の１２時ということもあり、辺りは閑散としている。人気もなく誰かが歩いている様子もない。この辺りは居酒屋や商業施設に乏しく夜になると一気に人がいなくなる住宅街だ。「幽体離脱するんだったらもっと賑やか所住めばよかった・・・」訳の分からない愚痴をこぼし近くにある公園へと歩いて、ではなく”浮いて”行った。公園に着いた。「やっぱ誰もいねえなあそりゃそうか」落胆の声が寂しい深夜の公園に響き渡る。"
    　　 "帰ろうかとふとベンチに視線を向けるとスーツのままベンチに座り涙を流すＯＬの姿があった。何事だ！？と内心人に会えた喜びで不謹慎にもテンションが上がる。とりあえず自分の姿が見えるかどうかのチェックをしようと近寄る。十中八九見えてないだろうとは思いつつももしかしたらもあるので念のため。「あのー大丈夫ですか？もしよかったら相談乗りますよ？」本来の自分だったらまず言わないであろう言葉が滑らかに口から飛び出た。幽体離脱状態はある程度気を大きくさせるのかもしれない。"
    　　"「あのー聞こえてますか？てゆうか見えてます？」女はうつむいたまま泣きじゃくる。どうやら見えてもないし聞こえてもないようだ。これでやりたいことができる、枷が外れた！と心躍ったものの泣きじゃくる彼女を見るとそんな気も失せてしまった。「何かつらい事でもあったんですか？よかったら俺が相談に乗るけど…このままだと消化不良っていうか…今から倫理観ぶっとんだ遊びするわけだから気持ちよく始めたいし。」もちろん独り言で終わった。今日初めて会った？人だがなんだかほっとけない。一方的ではあるが関わってしまった代償なのかもしれない。"
    　　
      ]
    };

    const chapterId = 1;
    let currentPage = 0;

    function updateChapterContent() {
      const content = chapterContents[chapterId][currentPage];
      document.getElementById('chapter-content').textContent = content;
    }

    document.getElementById('next-page').addEventListener('click', () => {
      if (currentPage < chapterContents[chapterId].length - 1) {
        currentPage++;
        updateChapterContent();
      }
    });

    document.getElementById('prev-page').addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        updateChapterContent();
      }
    });

    document.getElementById('back-to-top').addEventListener('click', () => {
      window.location.href = 'index.html'; // トップページのURLに変更
    });

    // 初期表示
    updateChapterContent();
  </script>
</body>
</html>
